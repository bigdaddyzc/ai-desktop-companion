; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-n16r8, s3-kit-28

; Shared by every env: same platform, toolchain, libraries and board file.
[env]
platform = espressif32@6.10.0
board = xinban-s3-n16r8
framework = arduino
extra_scripts = pre:short_include_paths.py
platform_packages =
	platformio/framework-arduinoespressif32@3.20017.0
	platformio/tool-esptoolpy@1.40501.0
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@7.3.1
	tzapu/WiFiManager@2.0.17
	bodmer/TFT_eSPI@2.5.43
	https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac
build_flags =
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D USER_SETUP_LOADED=1

; Design baseline: DevKitC-1 N16R8 + 1.54" ST7789 240x240 + two buttons.
[env:esp32-s3-n16r8]
build_flags =
	${env.build_flags}
	-include include/display_setup.h

; User's kit (bought 2026-11-12): S3 N16R8 dual Type-C board + 2.8" SPI touch
; screen in portrait (ILI9341 + XPT2046 assumed until the silkscreen is checked).
; No physical buttons: touch keys + BOOT as A. Onboard WS2812 on GPIO48.
[env:s3-kit-28]
build_flags =
	${env.build_flags}
	-include include/display_s3_kit_28.h
	-D XINBAN_BUTTON_A=-1
	-D XINBAN_BUTTON_B=-1
	-D XINBAN_BOOT_BUTTON=0
	-D XINBAN_RGB_PIN=48
	-D XINBAN_TOUCH_IRQ=5
	-D XINBAN_SCREEN_H=320
	'-D XINBAN_BOARD_NAME="esp32-s3-n16r8-kit28"'
